<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="S02 Manifesto background — deep darkness with subtle warm radial glow upper-left">
  <defs>
    <!-- Brand palette -->
    <!-- night #06080F · deep #0F1B2D · warm #1A1410 · gold #C9A24A · amber #F5A623 · cream #F5E9D3 -->

    <!-- Subtle warm radial glow, upper-left, very low intensity -->
    <radialGradient id="g02-warmth" cx="18%" cy="14%" r="58%" fx="18%" fy="14%">
      <stop offset="0%"  stop-color="#F5A623" stop-opacity="0.18"/>
      <stop offset="22%" stop-color="#C9A24A" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#1A1410" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#06080F" stop-opacity="0"/>
    </radialGradient>

    <!-- Base vertical falloff into deeper night -->
    <linearGradient id="g02-fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0F1B2D" stop-opacity="1"/>
      <stop offset="55%" stop-color="#06080F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#04060C" stop-opacity="1"/>
    </linearGradient>

    <!-- Vignette -->
    <radialGradient id="g02-vig" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Heavy film grain -->
    <filter id="g02-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.06
        0 0 0 0 0.06
        0 0 0 0 0.08
        0 0 0 0.55 0"/>
    </filter>

    <!-- Soft warm blur over the glow origin to feel candlelight-like -->
    <filter id="g02-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#g02-fall)"/>
  <rect width="1600" height="900" fill="#06080F"/>

  <!-- Warm radial glow, filtered for a candle-dawn feel -->
  <g filter="url(#g02-soft)" opacity="0.9">
    <rect width="1600" height="900" fill="url(#g02-warmth)"/>
  </g>

  <!-- Vignette -->
  <rect width="1600" height="900" fill="url(#g02-vig)"/>

  <!-- Grain layer (screen blend) -->
  <rect width="1600" height="900" filter="url(#g02-grain)" style="mix-blend-mode:screen" opacity="0.6"/>
</svg>
