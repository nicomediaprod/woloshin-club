<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Almost-solid black -->
    <radialGradient id="s12-base" cx="50%" cy="55%" r="80%">
      <stop offset="0%"   stop-color="#0B0810"/>
      <stop offset="55%"  stop-color="#06080F"/>
      <stop offset="100%" stop-color="#02030A"/>
    </radialGradient>

    <!-- Warm vertical glow from bottom -->
    <linearGradient id="s12-warm-floor" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"   stop-color="#F5A623" stop-opacity="0.10"/>
      <stop offset="20%"  stop-color="#C9A24A" stop-opacity="0.05"/>
      <stop offset="50%"  stop-color="#1A1410" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#06080F" stop-opacity="0"/>
    </linearGradient>

    <!-- Faint gold vertical slit in center (doorway / portal) -->
    <linearGradient id="s12-slit" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"   stop-color="#F5A623" stop-opacity="0.18"/>
      <stop offset="35%"  stop-color="#C9A24A" stop-opacity="0.10"/>
      <stop offset="75%"  stop-color="#F5E9D3" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F5E9D3" stop-opacity="0"/>
    </linearGradient>

    <!-- Doorway side glow (slight horizontal bleed) -->
    <radialGradient id="s12-door-glow" cx="50%" cy="62%" r="22%">
      <stop offset="0%"   stop-color="#F5A623" stop-opacity="0.08"/>
      <stop offset="40%"  stop-color="#C9A24A" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#06080F" stop-opacity="0"/>
    </radialGradient>

    <!-- Heavy grain -->
    <filter id="s12-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.88
                              0 0 0 0 0.72
                              0 0 0 0 0.40
                              0 0 0 0.20 0"/>
    </filter>

    <filter id="s12-blur-soft">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <!-- Heavy vignette -->
    <radialGradient id="s12-vig" cx="50%" cy="50%" r="72%">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Mask to soften the slit edges -->
    <linearGradient id="s12-slit-mask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <mask id="s12-slitmask">
      <rect x="900" y="0" width="120" height="1080" fill="url(#s12-slit-mask)"/>
    </mask>
  </defs>

  <!-- Base wash -->
  <rect width="1920" height="1080" fill="url(#s12-base)"/>

  <!-- Warm vertical gradient from bottom -->
  <rect width="1920" height="1080" fill="url(#s12-warm-floor)"/>

  <!-- Center doorway glow (soft halo) -->
  <rect width="1920" height="1080" fill="url(#s12-door-glow)"/>

  <!-- Vertical slit of light (the almost-closed door) -->
  <g mask="url(#s12-slitmask)">
    <rect x="900" y="0" width="120" height="1080" fill="url(#s12-slit)"/>
  </g>

  <!-- Brightest bottom-of-slit (where light hits the floor) -->
  <ellipse cx="960" cy="1080" rx="180" ry="40" fill="#F5A623" opacity="0.25" filter="url(#s12-blur-soft)"/>

  <!-- Heavy vignette to push edges into pure dark -->
  <rect width="1920" height="1080" fill="url(#s12-vig)"/>

  <!-- Heavy grain over everything -->
  <rect width="1920" height="1080" filter="url(#s12-grain)" opacity="0.55"/>
</svg>
