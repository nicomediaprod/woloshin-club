<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Near-pure-black base with barely-perceptible warmth -->
    <radialGradient id="s03-base" cx="80%" cy="80%" r="85%">
      <stop offset="0%"   stop-color="#0E0905"/>
      <stop offset="40%"  stop-color="#08070B"/>
      <stop offset="100%" stop-color="#02020A"/>
    </radialGradient>

    <!-- Single ember light source: lower-right, very subtle -->
    <radialGradient id="s03-ember" cx="82%" cy="82%" r="42%">
      <stop offset="0%"   stop-color="#F5A623" stop-opacity="0.16"/>
      <stop offset="20%"  stop-color="#C9A24A" stop-opacity="0.09"/>
      <stop offset="55%"  stop-color="#1A1410" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#06080F" stop-opacity="0"/>
    </radialGradient>

    <!-- Diagonal grain (turbulence) -->
    <filter id="s03-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1 0.4" numOctaves="2" seed="11" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.92
                              0 0 0 0 0.78
                              0 0 0 0 0.48
                              0 0 0 0.10 0"/>
    </filter>

    <filter id="s03-blur-soft">
      <feGaussianBlur stdDeviation="60"/>
    </filter>

    <!-- Vignette -->
    <radialGradient id="s03-vig" cx="50%" cy="50%" r="70%">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="1024" height="1024" fill="url(#s03-base)"/>

  <!-- Single ember light source in lower-right -->
  <rect width="1024" height="1024" fill="url(#s03-ember)"/>
  <circle cx="838" cy="838" r="180" fill="#F5A623" opacity="0.06" filter="url(#s03-blur-soft)"/>
  <circle cx="838" cy="838" r="60"  fill="#F5E9D3" opacity="0.05" filter="url(#s03-blur-soft)"/>

  <!-- Vignette (pushes focus to center where the "50" lives) -->
  <rect width="1024" height="1024" fill="url(#s03-vig)"/>

  <!-- Subtle grain -->
  <rect width="1024" height="1024" filter="url(#s03-grain)" opacity="0.45"/>
</svg>
